<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Liferay カスタマーサクセス アジア太平洋">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030F2C"/>
      <stop offset="0.6" stop-color="#0A1E54"/>
      <stop offset="1" stop-color="#0B5FFF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#4C8BFF" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect x="760" width="520" height="340" rx="18" fill="url(#dots)"/>

  <!-- abstract tile motif -->
  <g transform="translate(905 58)">
    <rect x="0"   y="0"   width="96" height="96" rx="14" fill="#0B5FFF"/>
    <rect x="112" y="0"   width="96" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="224" y="0"   width="96" height="96" rx="14" fill="#4C8BFF" fill-opacity="0.7"/>
    <rect x="0"   y="112" width="96" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="112" y="112" width="96" height="96" rx="14" fill="#FFFFFF"/>
    <rect x="224" y="112" width="96" height="96" rx="14" fill="#0B5FFF" fill-opacity="0.55"/>
    <rect x="112" y="224" width="96" height="40" rx="12" fill="#4C8BFF" fill-opacity="0.45"/>
  </g>

  <rect x="0" y="300" width="1280" height="40" fill="url(#glow)" opacity="0.5"/>

  <g font-family="'Source Sans Pro','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" fill="#FFFFFF">
    <text x="72" y="104" font-size="22" font-weight="600" letter-spacing="5" fill="#9FC0FF">LIFERAY  ·  アジア太平洋</text>
    <text x="70" y="176" font-size="60" font-weight="700">カスタマーサクセス</text>
    <text x="72" y="226" font-size="24" font-weight="400" fill="#D6E3FF">Liferay DXP の価値を、長く確かな成果に。</text>
    <rect x="72" y="256" width="72" height="6" rx="3" fill="#0B5FFF"/>
    <rect x="152" y="256" width="24" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>
</svg>
